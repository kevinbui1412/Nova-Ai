<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - KietAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-white flex items-center justify-center px-4 font-sans">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white font-bold text-xl shadow-sm mb-3">K</div>
            <h2 class="text-2xl font-bold text-gray-900 tracking-wide">Đăng Nhập</h2>
            <p class="text-xs text-gray-500 mt-1">Chào mừng bạn quay trở lại với KietAI</p>
        </div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="mb-4 p-3 rounded-2xl bg-red-50 border border-red-100 text-red-600 text-xs text-center font-medium">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Tên đăng nhập</label>
                <input type="text" name="username" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-blue-600 focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Mật khẩu</label>
                <input type="password" name="password" required class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-sm text-gray-900 focus:outline-none focus:border-blue-600 focus:bg-white transition">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl transition shadow-sm text-sm mt-2">
                Đăng Nhập
            </button>
        </form>
        <p class="text-center text-xs text-gray-500 mt-6">
            Chưa có tài khoản? <a href="/register" class="text-blue-600 hover:underline font-semibold">Đăng ký ngay</a>
        </p>
    </div>
</body>
</html>
